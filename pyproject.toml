[project]
name = "indian-address-parser"
version = "0.1.0"
description = "Group 10 NLP project: tagging and normalising messy Indian addresses"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "seqeval>=1.2.2",
]

[project.optional-dependencies]
# Heavy; install only on the training machine / Colab (`uv sync --extra train`).
train = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "sklearn-crfsuite>=0.5",
]
# The web page of app/demo.py only (`uv sync --extra train --extra demo`).
demo = ["gradio>=5"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
